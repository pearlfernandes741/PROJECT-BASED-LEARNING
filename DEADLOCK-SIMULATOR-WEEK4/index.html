
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadlock Simulation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Deadlock Simulation System</h1>
        <p>Operating System Resource Management</p>
    </header>

    <main>
        <section class="dashboard">
            <h2>System Configuration</h2>
            <p>Processes: 5</p>
            <p>Resource Types: 3</p>
            <p>Available Resources: 3, 3, 2</p>
        </section>

        <section>
            <h2>Allocation Matrix</h2>
            <div id="allocation-matrix"></div>
        </section>

        <section>
            <h2>Maximum Matrix</h2>
            <div id="maximum-matrix"></div>
        </section>

        <section>
            <h2>Need Matrix</h2>
            <div id="need-matrix"></div>
        </section>

        <section>
            <h2>Resource Allocation Graph</h2>
            <div id="resource-graph"></div>
        </section>

        <section>
            <h2>Deadlock Management</h2>
            <button id="banker-btn">Run Banker's Algorithm</button>
            <button id="detect-btn">Detect Deadlock</button>
            <button id="request-btn">Request Resources</button>
            <button id="release-btn">Release Resources</button>
            <button id="recover-btn">Recover Deadlock</button>
        </section>

        <section>
            <h2>Activity Log</h2>
            <div id="activity-log"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
